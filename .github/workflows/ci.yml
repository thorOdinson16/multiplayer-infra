name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          for svc in services/*; do
            if [ -f "$svc/requirements.txt" ]; then
              pip install -r "$svc/requirements.txt" 2>/dev/null || true
            fi
          done
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 services/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Check Python syntax
        run: |
          for f in $(find services/ -name "*.py" -not -path "*/env/*" -not -path "*/node_modules/*" -not -path "*/__pycache__/*") scripts/test_ws_helpers.py; do
            python -m py_compile "$f"
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          for svc in services/*; do
            if [ -f "$svc/requirements.txt" ]; then
              pip install -r "$svc/requirements.txt" 2>/dev/null || true
            fi
          done
      - name: Run unit tests
        run: |
          for svc in services/*/app/; do
            if ls "$svc"test_*.py 2>/dev/null; then
              echo "Running tests in $svc"
              python -m pytest "$svc" -v --tb=short
            fi
          done

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build service images
        run: |
          failures=0
          for svc in services/*/; do
            service_name=$(basename "$svc")
            echo "Building $service_name..."
            if [ "$service_name" = "game-room" ]; then
              docker build -t "multiplayer-$service_name:ci" -f "$svc/Dockerfile" . 2>&1 || failures=$((failures + 1))
            else
              docker build -t "multiplayer-$service_name:ci" "$svc" 2>&1 || failures=$((failures + 1))
            fi
          done
          docker build -t "multiplayer-client:ci" client/ 2>&1 || failures=$((failures + 1))
          if [ "$failures" -gt 0 ]; then
            echo "$failures image(s) failed to build"
            exit 1
          fi

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: |
          docker compose up -d
          sleep 60
      - name: Wait for health
        run: |
          healthy=false
          for i in $(seq 1 90); do
            status=$(curl -sfk http://localhost:8080/health 2>/dev/null || echo "down")
            if [ "$status" != "down" ]; then
              echo "Services healthy after ${i}s"
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != "true" ]; then
            echo "FAIL: Services never became healthy"
            docker compose ps
            exit 1
          fi
      - name: Install Python deps for integration tests
        run: |
          pip install websockets pytest httpx
      - name: Run E2E test
        run: |
          bash scripts/test_end_to_end.sh
      - name: Test matchmaking service
        run: |
          python -m pytest services/matchmaking/test_matchmaking.py -v --tb=short
      - name: Test failover
        run: |
          bash scripts/test_failover.sh
      - name: Test failover timing
        run: |
          bash scripts/test_failover_timing.sh
      - name: Test hold slot restoration
        run: |
          bash scripts/test_hold_slot.sh
      - name: Verify telemetry events
        run: |
          bash scripts/test_telemetry.sh
      - name: Debug service logs
        if: failure()
        run: |
          echo "=== Container Status ==="
          docker compose ps
          for svc in kafka couchbase auth nginx game-room game-room-2 matchmaking replay leaderboard analytics notification reconnect-handler etcd-watcher; do
            echo "=== $svc ==="
            docker compose logs --tail=40 "$svc" 2>/dev/null || true
          done
      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
