services:
  # Example – will be populated as services are built
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
  couchbase:
    image: couchbase:7.6.0
    ports:
      - "8091-8096:8091-8096"
      - "11210:11210"
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    ports:
      - "2379:2379"
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
