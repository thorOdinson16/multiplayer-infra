apiVersion: v1
kind: ServiceAccount
metadata:
  name: matchmaking
  namespace: game-platform
  labels:
    app: matchmaking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: matchmaking-scale
  namespace: game-platform
  labels:
    app: matchmaking
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: matchmaking-scale-binding
  namespace: game-platform
  labels:
    app: matchmaking
subjects:
  - kind: ServiceAccount
    name: matchmaking
    namespace: game-platform
roleRef:
  kind: Role
  name: matchmaking-scale
  apiGroup: rbac.authorization.k8s.io
