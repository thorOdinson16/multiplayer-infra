events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream game_room_default {
        server game-room:8000;
    }

    map $arg_match_id $game_room_upstream {
        default game_room_default;
    }

    include /etc/nginx/conf.d/*.conf;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    server {
        listen 80;
        listen 443 ssl;
        client_max_body_size 10M;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        location /auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            set $backend "auth:8000";
            proxy_pass http://$backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /players/ {
            limit_req zone=api_limit burst=20 nodelay;
            set $backend "auth:8000";
            proxy_pass http://$backend/players/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /.well-known/ {
            set $backend "auth:8000";
            proxy_pass http://$backend/.well-known/;
            proxy_set_header Host $host;
        }

        location /matchmaking/ {
            limit_req zone=api_limit burst=10 nodelay;
            set $backend "matchmaking:8000";
            proxy_pass http://$backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /reconnect {
            limit_req zone=api_limit burst=10 nodelay;
            set $backend "reconnect-handler:8000";
            proxy_pass http://$backend/reconnect;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /replay/ {
            set $backend "replay:8000";
            proxy_pass http://$backend/replay/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /leaderboard {
            set $backend "leaderboard:8000";
            proxy_pass http://$backend/leaderboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /metrics {
            set $backend "analytics:8000";
            proxy_pass http://$backend/metrics;
            proxy_set_header Host $host;
        }

        location /ws {
            limit_req zone=ws_limit burst=50 nodelay;
            set $backend_upstream $game_room_upstream;
            proxy_pass http://$backend_upstream/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location /ws/notifications {
            set $backend "notification:8000";
            proxy_pass http://$backend/ws/notifications;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location /health {
            set $backend "auth:8000";
            proxy_pass http://$backend/health;
            proxy_set_header Host $host;
        }

        location /metrics/all {
            set $backend "auth:8000";
            proxy_pass http://$backend/metrics;
            proxy_set_header Host $host;
        }

        location / {
            return 404;
        }
    }
}
