events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Browser origins allowed to call the REST gateway (game client).
    map $http_origin $cors_origin {
        default "";
        "~^http://localhost(:[0-9]+)?$" $http_origin;
        "~^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    }

    # Default game-room upstream. Per-match leader upstreams and the
    # $game_room_upstream map are owned and generated exclusively by the
    # etcd-watcher service (see infra/nginx/conf.d/game-room-upstream.conf).
    upstream game_room_default {
        server game-room:8000;
    }

    include /etc/nginx/conf.d/*.conf;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    server {
        listen 80;
        listen 443 ssl;
        client_max_body_size 10M;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # CORS for the browser game client (served from a different origin).
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Max-Age 86400 always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location /auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            set $backend "auth:8000";
            proxy_pass http://$backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /players/ {
            limit_req zone=api_limit burst=20 nodelay;
            set $backend "auth:8000";
            proxy_pass http://$backend/players/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /.well-known/ {
            set $backend "auth:8000";
            proxy_pass http://$backend/.well-known/;
            proxy_set_header Host $host;
        }

        location /matchmaking/ {
            limit_req zone=api_limit burst=10 nodelay;
            set $backend "matchmaking:8000";
            proxy_pass http://$backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /reconnect {
            limit_req zone=api_limit burst=10 nodelay;
            set $backend "reconnect-handler:8000";
            proxy_pass http://$backend/reconnect;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /replay/ {
            set $backend "replay:8000";
            proxy_pass http://$backend/replay/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /leaderboard {
            set $backend "leaderboard:8000";
            proxy_pass http://$backend/leaderboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /metrics {
            set $backend "analytics:8000";
            proxy_pass http://$backend/metrics;
            proxy_set_header Host $host;
        }

        location /ws {
            limit_req zone=ws_limit burst=50 nodelay;
            set $backend_upstream $game_room_upstream;
            proxy_pass http://$backend_upstream/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location /ws/notifications {
            set $backend "notification:8000";
            proxy_pass http://$backend/ws/notifications;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location /health {
            set $backend "auth:8000";
            proxy_pass http://$backend/health;
            proxy_set_header Host $host;
        }

        location /metrics/all {
            set $backend "auth:8000";
            proxy_pass http://$backend/metrics;
            proxy_set_header Host $host;
        }

        location / {
            return 404;
        }
    }
}
