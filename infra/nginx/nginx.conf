events {
    worker_connections 1024;
}
http {
    upstream auth {
        server auth-service:8000;
    }
    server {
        listen 80;
        location /ws {
            proxy_pass http://game-room;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
